/* Launch screen: the iPop stage (brushed silver, the pearl mark, the wordmark), the loading mark under it; inline so it paints first */
#curtain{position:fixed;inset:0;z-index:999;display:grid;place-items:end center;background:url("assets/brand/ipop-hero.webp") center top/auto 86% no-repeat,linear-gradient(180deg,#c7c8ce 0%,#dcdde1 50%,#b9bac0 100%);transition:opacity .5s ease}
#curtain .hud{position:static;inset:auto;width:auto;height:auto;background:none;border:0;box-shadow:none;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none;display:grid;justify-items:center;gap:10px;text-align:center;color:#3a3a3a;font-family:Inter,"Plex Arabic",sans-serif;padding:0 16px calc(2vh + env(safe-area-inset-bottom,0px));transition:transform .5s ease}
#curtain .now{font:500 13px/1.4 Inter,"Plex Arabic",sans-serif;color:#3a3a3a}
#curtain .feat{font-weight:600;font-size:clamp(16px,4.4vw,22px);letter-spacing:-.01em;color:#111;max-width:84vw}
#curtain .loader{margin:6px auto 22px;color:#3a3a3a;zoom:.7}
#curtain .loader .text{color:#3a3a3a}
#curtain.open{opacity:0;pointer-events:none}#curtain.open .hud{transform:translateY(8px)}
#curtain.gone{display:none}
#curtain .now,#curtain .feat{display:none}#curtain.scan .now,#curtain.scan .feat{display:block}
@media (prefers-reduced-motion:reduce){#curtain,#curtain .hud{transition-duration:.01s}}
</style>

<script>
(function () {
  var c = document.getElementById("curtain"), t0 = Date.now(), done = false;
  // the full launch screen once per visit
  var again = false; try { again = sessionStorage.getItem("noir-curtain") === "1"; sessionStorage.setItem("noir-curtain", "1"); } catch (e) {}
  // later opens and refreshes in the same visit: just the logo for a moment, then a fade
  if (again) c.classList.add("quick");
  var q = new URLSearchParams(location.search).get("p") || (location.hash.indexOf("#p/") === 0 ? location.hash.slice(3) : "");
  if (q) {
    c.classList.add("scan");
    document.getElementById("cur-now").textContent = "Scanned · now showing";
    document.getElementById("cur-feat").textContent = q.replace(/-/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
  }
  function open() {
    if (done) return; done = true;
    var wait = Math.max(0, (c.classList.contains("quick") ? 900 : 1200) - (Date.now() - t0)); // long enough to see the logo
    setTimeout(function () {
      c.classList.add("open");
      setTimeout(function () { c.classList.add("gone"); }, 450);
    }, wait);
  }
  window.NoirCurtain = { open: open };
  // the refresh button shows the logo while it clears the cache and reloads
  window.NoirSplash = function () { c.classList.remove("gone", "open"); c.classList.add("quick"); };
  setTimeout(open, 4500); // never block the page
  c.addEventListener("click", open);
})();
</script>
