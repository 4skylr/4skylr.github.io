/* Launch screen: the iPop stage (brushed silver, the pearl mark, the wordmark), the loading mark under it; inline so it paints first */
#curtain{position:fixed;inset:0;z-index:999;display:grid;place-items:end center;background:url("assets/brand/ipop-hero.webp") center top/auto 86% no-repeat,linear-gradient(180deg,#c7c8ce 0%,#dcdde1 50%,#b9bac0 100%);transition:opacity .5s ease}

<script>
(function () {
  var c = document.getElementById("curtain"), t0 = Date.now(), done = false;
  // the full launch screen once per visit
  var again = false; try { again = sessionStorage.getItem("noir-curtain") === "1"; sessionStorage.setItem("noir-curtain", "1"); } catch (e) {}
  // later opens and refreshes in the same visit: just the logo for a moment, then a fade
  if (again) c.classList.add("quick");
  var q = new URLSearchParams(location.search).get("p") || (location.hash.indexOf("#p/") === 0 ? location.hash.slice(3) : "");
  if (q) {
    c.classList.add("scan");
    document.getElementById("cur-now").textContent = "Scanned · now showing";
    document.getElementById("cur-feat").textContent = q.replace(/-/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
  }
  function open() {
    if (done) return; done = true;
    var wait = Math.max(0, (c.classList.contains("quick") ? 900 : 1200) - (Date.now() - t0)); // long enough to see the logo
    setTimeout(function () {
      c.classList.add("open");
      setTimeout(function () { c.classList.add("gone"); }, 450);
    }, wait);
  }
  window.NoirCurtain = { open: open };
  // the refresh button shows the logo while it clears the cache and reloads
  window.NoirSplash = function () { c.classList.remove("gone", "open"); c.classList.add("quick"); };
  setTimeout(open, 4500); // never block the page
  c.addEventListener("click", open);
})();
</script>

<script>
(function () {
  var scan = window.CARD_DOOR || new URLSearchParams(location.search).get("p") || location.hash.indexOf("#p/") === 0;
  var open = false;
  try { open = sessionStorage.getItem("noir-site") === "1"; } catch (e) {}
  var gate = document.getElementById("site-gate");
  if (scan || open) { gate.remove(); return; }
  var curtain = document.getElementById("curtain");
  if (curtain) curtain.classList.add("gone");
  gate.hidden = false;
  var pin = "", dots = gate.querySelectorAll(".sg-dots i"), err = document.getElementById("sg-err");
  function paint() { dots.forEach(function (d, i) { d.classList.toggle("on", i < pin.length); }); }
  function wrong() { err.textContent = "Wrong code"; pin = ""; paint(); }
  gate.querySelectorAll("[data-n]").forEach(function (b) {
    b.onclick = function () { if (pin.length >= 4) return; pin += b.dataset.n; err.textContent = ""; paint(); };
  });
  gate.querySelector("[data-del]").onclick = function () { pin = pin.slice(0, -1); err.textContent = ""; paint(); };
  document.getElementById("sg-clear").onclick = function () { pin = ""; err.textContent = ""; paint(); };
  document.getElementById("sg-go").onclick = function () {
    var people = {};
    try { people = JSON.parse(localStorage.getItem("noir-col:people") || "{}"); } catch (e) {}
    var hit = Object.keys(people).map(function (k) { return people[k]; }).find(function (p) { return p && p.pin === pin && p.active !== false; });
    var who = pin === "899" ? { id: "admin", name: "Admin", role: "admin", branch: "unaizah" } : hit;
    if (!who) return wrong();
    try {
      sessionStorage.setItem("noir-site", "1");
      if (who.role === "admin") sessionStorage.setItem("noir-admin", "1");
      sessionStorage.setItem("noir-who", JSON.stringify({ id: who.id, name: who.name, role: who.role, branch: who.branch }));
    } catch (e) {}
    gate.remove();
  };
})();
</script>
