<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Noir Cinema</title>
<link rel="icon" href="logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0B0710;--card:#140C18;--line:rgba(244,237,228,.12);--text:#F4EDE4;--mute:#9A938C;--violet:#7A2A90}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"IBM Plex Sans",sans-serif;min-height:100vh}
body.ar{font-family:"Noto Sans Arabic","IBM Plex Sans",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:12px;background:var(--violet)}
.brand b{display:block;font-family:Syne,sans-serif;letter-spacing:.08em;font-size:14px}
.brand small{color:var(--mute);font-size:12px}
.lang button{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
main{max-width:880px;margin:0 auto;padding:64px 24px}
.mark{width:96px;height:96px;border-radius:22px;background:var(--violet);display:block;margin-bottom:22px}
h1{font-family:Syne,sans-serif;font-size:clamp(32px,6vw,56px);line-height:1;margin:0 0 12px}
p{color:var(--mute);max-width:46ch;margin:0}
.box{margin-top:36px;border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="logo.svg" alt="Noir Cinema"/>
    <div><b>NOIR CINEMA</b><small data-i="sub">Waiting for data</small></div>
  </div>
  <div class="lang">
    <button id="enBtn" class="on">EN</button>
    <button id="arBtn">AR</button>
  </div>
</header>
<main>
  <img class="mark" src="logo.svg" alt="Noir Cinema"/>
  <h1 data-i="title">Noir Cinema</h1>
  <p data-i="lede">Empty page on purpose. Send the content and it goes here.</p>
  <div class="box" data-i="box">No halls, vault, inventory or ledger until you provide the data.</div>
</main>
<script>
const T = {
  en:{sub:"Waiting for data",title:"Noir Cinema",lede:"Empty page on purpose. Send the content and it goes here.",box:"No halls, vault, inventory or ledger until you provide the data."},
  ar:{sub:"بانتظار البيانات",title:"نوار سينما",lede:"الصفحة فاضية عمد. أرسل المحتوى وأركّبه.",box:"ما فيه قاعات ولا خزنة ولا جرد لحين توصّل البيانات."}
};
let lang = localStorage.getItem("noir-lang") || "en";
function apply(){
  const p = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.body.classList.toggle("ar", lang === "ar");
  document.querySelectorAll("[data-i]").forEach(el => { if (p[el.dataset.i]) el.textContent = p[el.dataset.i]; });
  document.getElementById("enBtn").classList.toggle("on", lang === "en");
  document.getElementById("arBtn").classList.toggle("on", lang === "ar");
}
document.getElementById("enBtn").onclick = () => { lang = "en"; localStorage.setItem("noir-lang", lang); apply(); };
document.getElementById("arBtn").onclick = () => { lang = "ar"; localStorage.setItem("noir-lang", lang); apply(); };
apply();
</script>
</body>
</html>
