<style id="curtain-css">
/* Launch screen: the plain page background, the logo, a thin progress line; inline so it paints before anything else loads */
#curtain{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--page,#f2f2f7);transition:opacity .45s ease}
#curtain .hud{display:grid;justify-items:center;gap:14px;text-align:center;color:var(--ink,#000);font-family:Inter,"Plex Arabic",sans-serif;transition:transform .45s ease}
#curtain .now{font:600 13px/1.4 Inter,"Plex Arabic",sans-serif;color:var(--muted,#5f5f64)}
#curtain .feat{font-weight:700;font-size:clamp(18px,5vw,24px);letter-spacing:-.02em;max-width:84vw}
#curtain .load{width:min(200px,50vw);height:4px;border-radius:2px;background:var(--fill-3,rgba(118,118,128,.12));overflow:hidden}
#curtain .load i{display:block;height:100%;width:40%;border-radius:inherit;background:var(--sys-blue,#007aff);animation:cur-load 1.1s ease-in-out infinite}
@keyframes cur-load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
#curtain.open{opacity:0;pointer-events:none}#curtain.open .hud{transform:scale(1.04)}
#curtain.gone{display:none}
#curtain.quick .now,#curtain.quick .feat{display:none}
@media (prefers-reduced-motion:reduce){#curtain,#curtain .hud{transition-duration:.01s}#curtain .load i{animation:none}}
</style>

<body class="card-only">
<div id="curtain" aria-hidden="true">
  <div class="hud">
    <span class="now" id="cur-now">Now showing</span>
    <span class="nlogo" style="--s:1.4" aria-hidden="true"><span class="nlogo-in"><span class="nlogo-l"><span class="nlogo-bg"></span></span><span class="nlogo-l"><span class="nlogo-bg"></span></span><span class="nlogo-l is-blur"><span class="nlogo-bg"></span></span></span></span>
    <span class="feat" id="cur-feat">Concession Stock</span>
    <span class="load"><i></i></span>
  </div>
</div>
<script>
(function () {
  var c = document.getElementById("curtain"), t0 = Date.now(), done = false;
  var q = new URLSearchParams(location.search).get("p") || (location.hash.indexOf("#p/") === 0 ? location.hash.slice(3) : "");
  var ar = (sessionStorage.getItem("noir-card-lang") || "ar") !== "en";
  if (q) {
    document.getElementById("cur-now").textContent = ar ? "تم المسح · يعرض الآن" : "Scanned · now showing";
    document.getElementById("cur-feat").textContent = q.replace(/-/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
  }
  function open() {
    if (done) return; done = true;
    var wait = Math.max(0, 1200 - (Date.now() - t0)); // long enough to see the logo
    setTimeout(function () {
      c.classList.add("open");
      setTimeout(function () { c.classList.add("gone"); }, 450);
    }, wait);
  }
  window.NoirCurtain = { open: open };
  // the refresh button shows the logo while it clears the cache and reloads
  window.NoirSplash = function () { c.classList.remove("gone", "open"); c.classList.add("quick"); };
  setTimeout(open, 4500); // never block the page
  c.addEventListener("click", open);
})();
</script>
