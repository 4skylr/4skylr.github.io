<style id="curtain-css">
/* Booth shutters — inline so they paint before anything else loads */
#curtain{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden;--v1:#020306;--v2:#0b111c;--v3:#18233a}
#curtain .cv{position:absolute;top:0;bottom:0;width:51%;pointer-events:auto;
 background:
  linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.55)),
  repeating-linear-gradient(90deg,var(--v1) 0,var(--v2) 3.2%,var(--v3) 4.6%,var(--v2) 6.2%,var(--v1) 9.6%);
 box-shadow:inset 0 0 120px rgba(0,0,0,.65);transition:transform 1.25s cubic-bezier(.7,0,.2,1),filter 1.25s;will-change:transform}
#curtain .cv.l{left:0;transform-origin:0 0;border-right:2px solid #6ccbff;box-shadow:inset 0 0 120px rgba(0,0,0,.65),6px 0 30px rgba(108,203,255,.55)}
#curtain .cv.r{right:0;transform-origin:100% 0;border-left:2px solid #dce6ff;box-shadow:inset 0 0 120px rgba(0,0,0,.65),-6px 0 30px rgba(220,230,255,.55)}
#curtain .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);background-size:300% 100%;animation:cv-sheen 3.2s linear infinite}
@keyframes cv-sheen{to{background-position:-300% 0}}
#curtain .val{position:absolute;left:0;right:0;top:0;height:64px;z-index:2;pointer-events:auto;
 background:linear-gradient(180deg,#020306,#0b111c);border-bottom:1px solid rgba(220,230,255,.22);
 box-shadow:0 10px 40px rgba(0,0,0,.6);transition:transform 1s cubic-bezier(.7,0,.2,1) .25s;
 -webkit-mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x;mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x}
#curtain .bulbs{display:none;position:absolute;left:0;right:0;top:12px;height:10px;z-index:3;
 background:radial-gradient(circle,#ffe7a3 0 3px,rgba(255,181,71,.35) 4px,transparent 6px) 0 0/22px 10px repeat-x;animation:bulbs .5s steps(2) infinite;transition:opacity .4s}
@keyframes bulbs{50%{filter:brightness(.45)}}
#curtain .hud{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;z-index:4;text-align:center;color:#fbf7ff;font-family:Geist,system-ui,sans-serif;transition:opacity .45s,transform .6s}
#curtain .logo{font-weight:900;font-size:clamp(46px,14vw,92px);letter-spacing:-.05em;line-height:1;
 background:linear-gradient(90deg,#5b7bff,#dce6ff,#ffb547,#6ccbff,#5b7bff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:holo 2.4s linear infinite;filter:drop-shadow(0 0 22px rgba(220,230,255,.55))}
@keyframes holo{to{background-position:-300% 0}}
#curtain .now{font:500 12px/1.4 Geist Mono,ui-monospace,monospace;letter-spacing:.06em;color:#a3adbf}
#curtain .feat{font-weight:800;font-size:clamp(18px,5vw,26px);max-width:84vw}
#curtain .load{width:min(240px,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#curtain .load i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#6ccbff,#dce6ff);border-radius:inherit;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
#curtain .hash{font:400 10px Geist Mono,ui-monospace,monospace;color:rgba(255,255,255,.45);letter-spacing:.08em}
#curtain.open .cv.l{transform:translateX(-102%) skewY(-4deg);filter:brightness(.6)}
#curtain.open .cv.r{transform:translateX(102%) skewY(4deg);filter:brightness(.6)}
#curtain.open .val{transform:translateY(-110%)}
#curtain.open .bulbs{opacity:0}
#curtain.open .hud{opacity:0;transform:scale(1.15)}
#curtain.gone{display:none}
@media (prefers-reduced-motion:reduce){#curtain .cv,#curtain .val,#curtain .hud{transition-duration:.01s}}
</style>

<div id="curtain" aria-hidden="true">
  <div class="cv l"></div><div class="cv r"></div>
  <div class="val"></div><div class="bulbs"></div>
  <div class="hud">
    <span class="now" id="cur-now">Now showing</span>
    <span class="logo s67 big"><img src="assets/67/base.webp" alt=""><img class="hl" src="assets/67/l.webp" alt=""><img class="hr" src="assets/67/r.webp" alt=""></span>
    <span class="feat" id="cur-feat">Concession Stock</span>
    <span class="load"><i></i></span>
    <span class="hash" id="cur-hash">0x0000…</span>
  </div>
</div>
<script>
(function () {
  var c = document.getElementById("curtain"), t0 = Date.now(), done = false;
  var q = new URLSearchParams(location.search).get("p") || (location.hash.indexOf("#p/") === 0 ? location.hash.slice(3) : "");
  var ar = (sessionStorage.getItem("noir-card-lang") || "ar") !== "en";
  if (q) {
    document.getElementById("cur-now").textContent = ar ? "تم المسح · يعرض الآن" : "Scanned · now showing";
    document.getElementById("cur-feat").textContent = q.replace(/-/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
  }
  var h = document.getElementById("cur-hash"), hex = "0123456789abcdef";
  var spin = setInterval(function () { var s = "0x"; for (var i = 0; i < 16; i++) s += hex[Math.random() * 16 | 0]; h.textContent = s; }, 70);
  function open() {
    if (done) return; done = true;
    var wait = Math.max(0, 950 - (Date.now() - t0));
    setTimeout(function () {
      clearInterval(spin); c.classList.add("open");
      setTimeout(function () { c.classList.add("gone"); }, 1400);
    }, wait);
  }
  window.NoirCurtain = { open: open };
  setTimeout(open, 4500); // never block the page
  c.addEventListener("click", open);
})();
</script>
<script>
try {
  if (!localStorage.getItem("noir-bust-88")) {
    localStorage.setItem("noir-bust-88", "1");
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
  }
} catch (e) {}
</script>
