# Rebuilds k7/unaizah/ledger.json whenever a DCS workbook is added or changed.
name: Unaizah ledger

on:
  push:
    branches: [main]
    paths:
      - "k7/unaizah/files/**"
      - "k7/unaizah/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl odfpy xlrd
      - run: python k7/unaizah/build.py
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k7/unaizah/ledger.json
          git diff --cached --quiet || git commit -m "Rebuild Unaizah ledger from DCS files"
          git push
